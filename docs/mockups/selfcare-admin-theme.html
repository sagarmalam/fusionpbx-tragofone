<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Self-Care Theme Editor Mockup</title><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#f4f6f8;color:#172033;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1080px;margin:auto}.title h1{margin:0;font-size:25px}.title p{color:#667085}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:#fff;border:1px solid #d8dde6;border-radius:14px;padding:18px}.field{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;margin:13px 0}.input{min-height:42px;border:1px solid #c8d0dc;border-radius:9px;padding:10px}.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.preview{min-height:290px;border-radius:22px;padding:20px;background:#f7f8fa;color:#172033}.preview.dark{background:#10141d;color:#f4f7fb}.phone-card{margin-top:22px;padding:17px;border:1px solid currentColor;border-radius:15px;opacity:.9}.button{min-height:44px;border:0;border-radius:10px;background:#1769e0;color:#fff;padding:10px 15px;font-weight:700}.warning{margin-top:16px;padding:13px;border:1px solid #f5c451;background:#fff8df;border-radius:10px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}@media(max-width:760px){body{padding:14px}.grid{grid-template-columns:1fr}.field{grid-template-columns:1fr;gap:5px}.palette{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="title"><h1>Global Self-Care Branding</h1><p>Superadmin only · applies identically to every company</p></header><div class="grid"><section class="card"><label class="field"><b>Enable portal</b><input type="checkbox" checked></label><label class="field"><b>Public portal URL</b><input class="input" value="https://pbx.example/app/tragofone/selfcare"></label><label class="field"><b>Portal name</b><input class="input" id="name" value="Acme Voice"></label><label class="field"><b>Brand logo</b><input class="input" type="file"></label><div class="palette"><label>Light background<input class="input" value="F7F8FA"></label><label>Light text<input class="input" value="172033"></label><label>Dark background<input class="input" value="10141D"></label><label>Dark text<input class="input" value="F4F7FB"></label></div><div class="warning"><b>Global update</b><br>Saving branding queues a new signed Account URL for every eligible user.</div><div class="actions"><button class="button">Rotate salts</button><button class="button">Save global branding</button></div></section><section class="card"><div class="palette"><div class="preview"><b class="preview-name">Acme Voice</b><div class="phone-card"><b>Extension 1001</b><p>Calls and voicemail in one place.</p><button class="button">Open voicemail</button></div></div><div class="preview dark"><b class="preview-name">Acme Voice</b><div class="phone-card"><b>Extension 1001</b><p>Calls and voicemail in one place.</p><button class="button">Open voicemail</button></div></div></div></section></div><script>document.getElementById('name').oninput=function(){document.querySelectorAll('.preview-name').forEach(e=>e.textContent=this.value||'Tragofone')}</script></main></body></html>
